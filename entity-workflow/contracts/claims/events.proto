syntax = "proto3";

package claims;

option java_package = "claims.contracts";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

enum ClaimEventType {
  CLAIM_EVENT_TYPE_UNSPECIFIED = 0;
  CLAIM_CREATED = 1;
  CLAIM_REOPENED = 2;
  CLAIM_UPDATED = 3;
  ESTIMATE_RECEIVED = 4;
  DOCUMENTS_RECEIVED = 5;
  CLAIM_CLOSED = 6;
  CLAIM_REASSIGNED = 7;
  PAYMENT_CANCEL_REQUESTED = 8;    // an adjuster cancelled the claim's payment in ClaimsPro
}

// Canonical, non-personal change event sent by the event bridge. It names what changed; workflows
// re-read the current data from ClaimsPro.
message ClaimEvent {
  string event_id = 1;
  string claim_id = 2;
  ClaimEventType type = 3;
  string source_system = 4;
  google.protobuf.Timestamp occurred_at = 5;
}
