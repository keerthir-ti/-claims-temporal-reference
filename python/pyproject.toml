[project]
name = "claims-temporal-python"
version = "0.1.0"
description = "Claims on Temporal: TSA + IS track workflows, activities and workers (Python)"
requires-python = ">=3.10"
dependencies = [
  "temporalio==1.34.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-json-logger>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "datamodel-code-generator>=0.30"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
