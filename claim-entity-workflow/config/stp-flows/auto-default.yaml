# STP flow for auto claims. Stages run in order; the steps of one stage run in parallel. Only registered
# steps are allowed. A stage with PAY or CLOSE_CLAIM is never interrupted, whatever "interruptible" says.
flow_id: auto-default
version: 1
match: { line_of_business: AUTO }
stages:
  - { name: contact,    steps: [CONTACT_CUSTOMER],             interruptible: true }
  - { name: coverage,   steps: [VERIFY_COVERAGE],              interruptible: true }
  - { name: reserve,    steps: [OPEN_RESERVE],                 interruptible: true }
  - { name: inspection, steps: [DISPATCH, ASSIGN_APPRAISAL],   interruptible: true }
  - { name: estimate,   steps: [AWAIT_ESTIMATE],               interruptible: true }
  - { name: pay,        steps: [PAY] }
  - { name: close,      steps: [CLOSE_CLAIM] }
estimate_review_cents: 2000000      # estimates above 20,000.00 go to an appraiser
estimate_recheck_seconds: 60        # re-read eClaims in case the estimate event is lost
vendors_per_round: 3                # vendors offered before an adjuster is asked
