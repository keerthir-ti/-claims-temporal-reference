# Human decisions (the authority matrix): role per kind, deadline, escalation roles in order, choices
# that need a reason; limits used by the workflows.
# Placeholder values: replace with the authority matrix, deadlines and business calendar (see README,
# "Details still needed"). Kinds are the DecisionKind names in contracts/claims/v1/decisions.proto.
retry_window_seconds: 3600            # a step still failing after this opens an operations task
retriage_limit: 3                     # more re-triages than this go to ESCALATION
stp_payment_authority_cents: 1500000  # payments above 15,000.00 need approval
triage_confidence_threshold: 0.6      # AI results below this go to a triage adjuster
pilot_stp_only: false                 # true for the pilot: Claims Lifecycle -> STP only (no TSA, IS)

rules:
  TRIAGE_REVIEW:        { role: triage-adjuster,  deadline_seconds: 14400,  escalation_roles: [triage-supervisor] }
  MANUAL_HANDLING:      { role: adjuster,         deadline_seconds: 172800, reason_required_choices: [CLOSE] }   # deadline -> ESCALATION stage
  ESCALATION:           { role: supervisor,       deadline_seconds: 86400,  escalation_roles: [claims-manager] }
  SIU_REVIEW:           { role: siu-investigator, deadline_seconds: 259200, escalation_roles: [siu-supervisor], reason_required_choices: [DENY] }
  COVERAGE_INFORMATION: { role: is-reviewer,      deadline_seconds: 259200, escalation_roles: [supervisor] }
  CUSTOMER_NOT_REACHED: { role: adjuster,         deadline_seconds: 86400,  escalation_roles: [supervisor] }
  NO_VENDOR:            { role: adjuster,         deadline_seconds: 14400,  escalation_roles: [supervisor] }
  ESTIMATE_REVIEW:      { role: appraiser,        deadline_seconds: 86400,  escalation_roles: [supervisor] }
  PAYMENT_APPROVAL:     { role: payment-approver, deadline_seconds: 86400,  escalation_roles: [claims-manager], reason_required_choices: [REJECT] }
  REOPEN_REVIEW:        { role: adjuster,         deadline_seconds: 172800, escalation_roles: [supervisor] }
  OPERATIONS_EXCEPTION: { role: claims-operations, deadline_seconds: 0 }
