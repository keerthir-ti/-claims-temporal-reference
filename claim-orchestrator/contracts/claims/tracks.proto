syntax = "proto3";

package claims;

option java_package = "claims.contracts";
option java_multiple_files = true;

import "claims/common.proto";
import "claims/events.proto";

message TrackRequest {
  string claim_id = 1;
  int32 stage_version = 2;
  Track track = 3;
  string reason = 4;
  repeated ClaimEvent buffered_events = 5;
}

enum TrackOutcome {
  TRACK_OUTCOME_UNSPECIFIED = 0;
  ROUTE_STP = 1;
  ROUTE_INVESTIGATION = 2;
  ROUTE_MANUAL = 3;
  ROUTE_SIU = 4;
  RETRIAGE = 5;
  COMPLETED = 6;
}

// A track returns an outcome; it never moves the claim itself.
message TrackResult {
  TrackOutcome outcome = 1;
  string reason = 2;
  string flow_ref = 3;
}
