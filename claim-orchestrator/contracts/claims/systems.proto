syntax = "proto3";

package claims;

option java_package = "claims.contracts";
option java_multiple_files = true;

import "claims/common.proto";
import "claims/decisions.proto";

// ---- ClaimsPro --------------------------------------------------------------------------------
message ClaimRef {
  string claim_id = 1;
}

// Current claim data read from ClaimsPro. Workflows keep only what they route on.
message ClaimSnapshot {
  string claim_id = 1;
  string status = 2;                // OPEN | CLOSED
  string line_of_business = 3;
  string company = 4;
  string channel = 5;
  string state = 6;
  int64 change_version = 7;         // increases with every material change
  bool injury_reported = 8;
  int32 prior_claims = 9;
  int64 claimed_amount_cents = 10;
  string adjuster_id = 11;
}

message TaskRequest {
  StepRef step = 1;
  OpenDecision decision = 2;
}

message TaskRef {
  string task_id = 1;
}

message CloseTaskRequest {
  StepRef step = 1;
  string task_id = 2;
  string outcome = 3;
}

message ReserveRequest {
  StepRef step = 1;
  int64 amount_cents = 2;
}

message ReserveResult {
  string reserve_id = 1;
}

message CreatePaymentRequest {
  StepRef step = 1;
  string payment_key = 2;
  int64 amount_cents = 3;
  string payee_ref = 4;
}

message PaymentKeyRef {
  StepRef step = 1;
  string payment_key = 2;
}

message PaymentRecord {
  string payment_id = 1;
  string status = 2;                // CREATED | CLOSED | CANCELLED
}

message CloseClaimRequest {
  StepRef step = 1;
  string reason = 2;
}

message Done {
  bool ok = 1;
}

// ---- Comm Hub, Policy Gate, eClaims -------------------------------------------------------------
message StepRequest {
  StepRef step = 1;
}

message ContactResult {
  bool reached = 1;
}

message CoverageResult {
  bool covered = 1;
  string reason = 2;
}

message DispatchResult {
  bool accepted = 1;
  string vendor_id = 2;
}

message AppraisalResult {
  string appraisal_id = 1;
}

message EstimateResult {
  bool available = 1;
  int64 amount_cents = 2;
}

// ---- AI agents (TSA, IS) -------------------------------------------------------------------------
message RiskAssessment {
  double fraud_score = 1;
  double complexity = 2;
  double confidence = 3;
  string summary = 4;
  bool coverage_question = 5;       // coverage facts missing: route to investigation
}

message CoverageAnalysis {
  bool information_complete = 1;
  string missing = 2;
  double confidence = 3;
}

message TriageRuling {
  string route = 1;                 // STP | INVESTIGATION | MANUAL | SIU
  string reason = 2;
  bool needs_review = 3;
}

message TriageInput {
  ClaimSnapshot claim = 1;
  RiskAssessment risk = 2;
  double confidence_threshold = 3;
}

// ---- STP flow definition --------------------------------------------------------------------------
message FlowDefinition {
  string flow_id = 1;
  int32 version = 2;
  string content_hash = 3;
  repeated string steps = 4;
  int64 estimate_review_cents = 5;
  int32 estimate_wait_seconds = 6;
  int32 estimate_recheck_seconds = 7;
}
