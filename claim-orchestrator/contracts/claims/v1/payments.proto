syntax = "proto3";

package claims.v1;

option java_package = "claims.contracts.v1";
option java_multiple_files = true;

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_CLOSED = 1;
  PAYMENT_CANCELLED = 2;
  PAYMENT_REJECTED = 3;
}

message PaymentRequest {
  string claim_id = 1;
  int32 stage_version = 2;
  string payment_key = 3;
  int64 amount_cents = 4;
  string payee_ref = 5;
  string requested_by = 6;
  string stp_workflow_id = 7;
}

message PaymentResult {
  string claim_id = 1;
  string payment_key = 2;
  PaymentStatus status = 3;
  string payment_id = 4;
  string approved_by = 5;
  string reason = 6;
}

message CancelPayment {
  string requested_by = 1;
  string reason = 2;
}
